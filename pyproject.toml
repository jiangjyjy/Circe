[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circe"
version = "0.1.0"
description = "CIRCE: calibrated interruption via risk-controlled e-processes for black-box agent harnesses (core controller library)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CIRCE authors" }]
keywords = ["agents", "early-stopping", "e-process", "sequential-testing", "risk-control"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
